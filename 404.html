<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPH Solutions</title>
    <meta name="robots" content="noindex" />
    <!--
      Single-Page-App redirect for GitHub Pages.
      When GitHub Pages serves this file for an unknown path (e.g. /data-brief/mdd-east-africa-2025),
      we encode the original path into the query string and redirect to index.html, which then
      restores the original URL using history.replaceState before React Router boots.
      Custom domain (CNAME) at site root => pathSegmentsToKeep = 0.
      Reference: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function () {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    <noscript>
      The page you requested could not be found.
      <a href="/">Return to NPH Solutions home</a>.
    </noscript>
  </body>
</html>
